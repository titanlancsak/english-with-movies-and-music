name: Android

# Builds the Android version (app-flutter/): compiles whisper-cli and ffmpeg for
# 64-bit ARM phones and builds the signed APK (in the run's artifacts; attached
# to releases once PUBLISH_ANDROID is enabled).
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['app-flutter/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.38.4'
  NDK_VERSION: '28.2.13676358'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-flutter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Tests
        run: |
          flutter pub get
          dart test test/core_test.dart

      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          sudo apt-get install -y ninja-build > /dev/null

      - name: Build whisper-cli and ffmpeg for Android
        run: android/native-tools/build.sh

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No signing key (e.g. a fork): the APK is signed with a debug key."
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          flutter build apk --release --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/EnglishWithMovies-Android.apk"
          unzip -l "$GITHUB_WORKSPACE/EnglishWithMovies-Android.apk" | grep -E "lib(ffmpeg|ffprobe|whisper_cli|whisper_cli_fast)\.so"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs "$GITHUB_WORKSPACE/EnglishWithMovies-Android.apk" | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: EnglishWithMovies-Android
          path: EnglishWithMovies-Android.apk

      # Not attached to releases until the Android version is tested on a real phone (issue #1).
      # To publish it, set the repository variable PUBLISH_ANDROID to "true".
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_ANDROID == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: EnglishWithMovies-Android.apk
